name: Convert and Upload Images to R2

on:
  push:
    branches: ["master"]
    paths:
      - "src/main/resources/**"
      - "web_data/**"
      - "scripts/convert_and_upload_to_s3.py"
      - "scripts/generate_data.py"
  workflow_dispatch:

concurrency:
  group: convert-and-upload-images
  cancel-in-progress: true

jobs:
  convert-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate TypeScript data files
        run: |
          python scripts/generate_data.py all

      - name: Convert and upload images and data to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python scripts/convert_and_upload_to_s3.py --bucket ti4images

      - name: Report results
        if: always()
        run: |
          echo "Image conversion, data generation, and upload process completed"
          echo "Check logs above for detailed conversion and upload statistics"
