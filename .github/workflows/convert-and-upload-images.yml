name: Convert and Upload Images to S3

# Disabled on this fork: assumes AWS IAM role
# arn:aws:iam::412381764112:role/GithubActionsWebsiteRole, whose OIDC trust policy only
# authorizes upstream's repo, not this fork. Kept for reference / manual reactivation via
# workflow_dispatch once this fork has its own R2/AWS credentials wired up.
on:
  workflow_dispatch:

jobs:
  convert-and-upload:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate TypeScript data files
        run: |
          python scripts/generate_data.py all

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::412381764112:role/GithubActionsWebsiteRole
          aws-region: us-east-1

      - name: Convert and upload images and data to S3
        run: |
          python scripts/convert_and_upload_to_s3.py

      - name: Report results
        if: always()
        run: |
          echo "Image conversion, data generation, and upload process completed"
          echo "Check logs above for detailed conversion and upload statistics"
